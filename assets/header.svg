<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Gabin Simond</title>
  <desc id="d">Développeur — code, homelab et projets faits maison</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .orbA { animation: driftA 14s ease-in-out infinite alternate; }
    .orbB { animation: driftB 18s ease-in-out infinite alternate; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .7s; } .d4 { animation-delay: 1s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .star { animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: 1.3s; } .s3 { animation-delay: 2.1s; } .s4 { animation-delay: 3s; }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(90px,40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-110px,-30px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .orbA, .orbB, .cursor, .star { animation: none; }
      .rise { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle class="orbA" cx="180" cy="70" r="300" fill="url(#orbA)"/>
    <circle class="orbB" cx="1060" cy="330" r="340" fill="url(#orbB)"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridMask)"/>

    <g fill="#fff">
      <circle class="star" cx="930" cy="74" r="1.8"/>
      <circle class="star s2" cx="1085" cy="128" r="1.4"/>
      <circle class="star s3" cx="250" cy="300" r="1.6"/>
      <circle class="star s4" cx="640" cy="52" r="1.3"/>
      <circle class="star s3" cx="1010" cy="250" r="1.5"/>
    </g>

    <g class="rise d1">
      <rect x="80" y="74" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="100" cy="91" r="4.5" fill="#4ade80"/>
      <text x="114" y="96" class="mono" font-size="13.5" fill="#cbd5e1" letter-spacing="0.4">~/gabin · France</text>
    </g>

    <text x="78" y="196" class="sans rise d2" font-size="86" font-weight="800" letter-spacing="-2.5" fill="url(#name)">Gabin Simond</text>

    <text x="82" y="248" class="sans rise d3" font-size="25" font-weight="500" fill="#e2e8f0" fill-opacity="0.92">Développeur — du code, un homelab et des projets faits maison.</text>

    <g class="rise d4">
      <text x="82" y="308" class="mono" font-size="17" fill="#94a3b8"><tspan fill="#7dd3fc">$</tspan> build · self-host · ship<tspan class="cursor" fill="#f0abfc" dx="6">▍</tspan></text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
</svg>
